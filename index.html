<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LPG Ledger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LPG Ledger">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --ink:#1B2A2E; --ink-soft:#4B5A5D; --line:#D9DDD9; --line-soft:#E7EAE7;
    --paper:#F5F6F5; --card:#FFFFFF;
    --flame:#C4661F; --flame-100:#F3E2D2; --flame-800:#7A3D0F;
    --teal:#0F6E56; --teal-100:#DCEEE8; --teal-800:#084234;
    --red:#A32D2D; --red-100:#F7DEDE; --red-800:#5C1919;
    --mono: 'SFMono-Regular', ui-monospace, 'Menlo', 'Consolas', monospace;
    --sans: -apple-system, 'Segoe UI', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  #app{max-width:860px;margin:0 auto;padding:0 0 60px;}
  header.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:16px 18px 12px;}
  .brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .brand h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-0.01em;}
  .brand h1 span{color:var(--flame);}
  .who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);}
  .authcard{max-width:380px;margin:40px auto;}
  .authcard a{cursor:pointer;text-decoration:underline;color:var(--teal);}
  .roletag{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--teal-100);color:var(--teal-800);}
  nav.tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto;padding-bottom:2px;}
  nav.tabs button{white-space:nowrap;font-family:var(--sans);font-size:13px;font-weight:500;padding:8px 13px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink-soft);cursor:pointer;}
  nav.tabs button.active{background:var(--card);border-color:var(--line);color:var(--ink);}
  nav.tabs button:hover:not(.active){color:var(--ink);}
  main{padding:20px 18px;}
  .card{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:18px;margin-bottom:14px;}
  .card h2{font-size:15px;font-weight:600;margin:0 0 3px;}
  .card .sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;}
  .empty{padding:34px 16px;text-align:center;color:var(--ink-soft);font-size:13.5px;}
  label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-soft);margin:12px 0 5px;}
  label:first-child{margin-top:0;}
  input,select,textarea{width:100%;font-family:var(--sans);font-size:14.5px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:-1px;}
  input[type=file]{padding:8px;font-size:13px;}
  input[type=checkbox]{width:auto;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:13.5px;font-weight:500;padding:10px 16px;border-radius:9px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;margin-top:16px;}
  .btn:hover{opacity:.9;}
  .btn.secondary{background:transparent;color:var(--ink);border-color:var(--line);}
  .btn.danger{background:var(--red);border-color:var(--red);}
  .btn.small{padding:6px 10px;font-size:12px;margin-top:0;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .purchase-row{border:1px solid var(--line-soft);border-radius:11px;padding:13px 15px;margin-bottom:10px;cursor:pointer;}
  .purchase-row:hover{border-color:var(--line);}
  .purchase-row .pr-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .purchase-row .pr-top strong{font-size:14px;font-family:var(--mono);}
  .status{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:5px;}
  .status.open{background:var(--flame-100);color:var(--flame-800);}
  .status.closed{background:var(--teal-100);color:var(--teal-800);}
  .pr-meta{font-size:12px;color:var(--ink-soft);margin-top:4px;font-family:var(--mono);}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;}
  th{text-align:left;font-weight:500;color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:6px 8px;border-bottom:1px solid var(--line);}
  td{padding:8px 8px;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:12.5px;}
  td.flat{font-family:var(--sans);font-weight:500;font-size:13px;}
  tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:none;}
  .num{text-align:right;}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px;}
  .stat-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
  .stat{background:var(--paper);border-radius:9px;padding:10px 12px;}
  .stat .v{font-family:var(--mono);font-size:16px;font-weight:600;}
  .stat .l{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
  .toggle-group{display:flex;gap:6px;margin-top:12px;}
  .toggle-group button{flex:1;font-family:var(--sans);font-size:13px;font-weight:500;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);cursor:pointer;}
  .toggle-group button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .method-note{margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--flame-100);color:var(--flame-800);font-size:12.5px;}
  .batch-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--teal-100);color:var(--teal-800);border-radius:10px;padding:11px 14px;margin-bottom:14px;font-size:13px;}
  .batch-banner b{font-family:var(--mono);}
  .batch-banner a{color:var(--teal-800);font-size:12px;text-decoration:underline;cursor:pointer;}
  .flat-history{border:1px solid var(--line-soft);border-radius:11px;padding:12px 14px;margin-bottom:9px;display:flex;gap:12px;align-items:flex-start;}
  .flat-history img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex-shrink:0;cursor:pointer;}
  .flat-history .ph-none{width:56px;height:56px;border-radius:8px;background:var(--line-soft);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-soft);text-align:center;}
  .flat-history .fh-body{flex:1;font-size:12.5px;}
  .flat-history .fh-body b{font-size:13.5px;}
  .flat-history .fh-meta{color:var(--ink-soft);font-family:var(--mono);font-size:11.5px;margin-top:2px;}
  .user-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);}
  .user-row:last-child{border-bottom:none;}
  .user-row .ui{flex:1;min-width:0;}
  .user-row .ui b{font-size:13.5px;display:block;}
  .user-row .ui span{font-size:11.5px;color:var(--ink-soft);}
  .user-row select{width:auto;font-size:12px;padding:5px 8px;}
  .flatrow{display:grid;grid-template-columns:56px 1fr 1fr 90px 60px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-soft);}
  .flatrow input{padding:6px 8px;font-size:12.5px;}
  .flatrow .fid{font-family:var(--mono);font-weight:600;font-size:13px;}
  .flatrow.inactive{opacity:.45;}
  .pill{display:inline-block;font-size:10.5px;padding:3px 8px;border-radius:20px;cursor:pointer;text-align:center;font-family:var(--sans);}
  .pill.active{background:var(--teal-100);color:var(--teal-800);}
  .pill.inactive{background:var(--line-soft);color:var(--ink-soft);}
  .modal-bg{position:fixed;inset:0;background:rgba(20,25,25,.7);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20;}
  .modal-bg img{max-width:100%;max-height:80vh;border-radius:10px;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;}
  .toast.show{opacity:1;}
  .locked{padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:13.5px;}
  .offline-banner{background:var(--red-100);color:var(--red-800);font-size:12px;text-align:center;padding:7px 14px;display:none;align-items:center;justify-content:center;gap:6px;position:sticky;top:0;z-index:6;}
  .subcard{background:var(--paper);border:1px solid var(--line-soft);border-radius:10px;padding:12px;margin-bottom:10px;}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .bignum{font-family:var(--mono);font-size:24px;font-weight:700;}
  .bignum-l{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
  .chart-legend{font-size:11px;color:var(--ink-soft);margin-top:6px;line-height:1.6;}
  .warn-box{margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--red-100);color:var(--red-800);font-size:12.5px;}
  .range-toggle{display:flex;gap:6px;margin:10px 0;}
  .range-toggle button{font-size:11.5px;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);cursor:pointer;}
  .range-toggle button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .inline-edit{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:12px;margin-top:10px;}
  .rowbtns{display:flex;gap:6px;margin-top:0;}
  @media(max-width:480px){ .row2,.row3{grid-template-columns:1fr;} .stat-grid,.stat-grid-3{grid-template-columns:1fr 1fr;} .flatrow{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="app">
  <div id="offlineBanner" class="offline-banner" style="display:none;"></div>
  <header class="top">
    <div class="brand">
      <h1>LPG <span>Ledger</span></h1>
      <div class="who">
        <span class="roletag" id="roleTag">ADMIN</span>
        <button id="logoutBtn" class="btn secondary small" style="margin-top:0;display:none;">Log out</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="main"></main>
</div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ====== Supabase config — paste your own project's values here ======
const SUPABASE_URL = 'https://bqqyclfhzayogxaqzpgb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxcXljbGZoemF5b2d4YXF6cGdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0NzM4MDAsImV4cCI6MjEwMDA0OTgwMH0.SUx-uKM3OloQcbMQdPv6AXap2ZcT2n_h27eKhur9rZA';
let sb = null;
if(SUPABASE_URL.indexOf('PASTE_')!==0 && window.supabase){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

async function loadStore(key, shared, fallback){
  if(!sb) return fallback;
  try{
    if(key.indexOf('photo:')===0) return fallback; // photos are read via photoUrl(), not this path
    const { data, error } = await sb.from('app_state').select('data').eq('id','main').maybeSingle();
    if(error) throw error;
    return data ? data.data : null; // null = confirmed empty on the server
  }catch(e){ console.error('load failed', e); return undefined; } // undefined = could not reach the server
}
async function saveStore(key, shared, value){
  if(!sb){ toast('Not saved — Supabase is not connected yet'); return; }
  if(!navigator.onLine){ toast("You're offline — this can't be saved until you're back online"); return; }
  try{
    if(key.indexOf('photo:')===0){
      await uploadPhoto(key.slice(6), value);
      return;
    }
    const { error } = await sb.from('app_state').upsert({ id:'main', data:value, updated_at:new Date().toISOString() });
    if(error){ console.error('save failed', error); toast('Save failed — check Supabase setup'); }
    else cacheDataLocally(value);
  }catch(e){ console.error('storage failed', e); toast('Save failed — check Supabase setup'); }
}
async function uploadPhoto(readingId, dataUrl){
  if(!sb) return;
  try{
    const blob = await (await fetch(dataUrl)).blob();
    await sb.storage.from('meter-photos').upload(readingId+'.jpg', blob, { upsert:true, contentType:'image/jpeg' });
  }catch(e){ console.error('photo upload failed', e); }
}
function photoUrl(readingId){
  if(!sb) return null;
  const { data } = sb.storage.from('meter-photos').getPublicUrl(readingId+'.jpg');
  return data ? data.publicUrl : null;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 2600);
}
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,8); }

const OFFLINE_DATA_KEY = 'lpg_cache_data_v1';
const OFFLINE_PROFILE_KEY = 'lpg_cache_profile_v1';
let IS_OFFLINE = !navigator.onLine;
let USING_CACHED_DATA = false;
function cacheDataLocally(d){ try{ localStorage.setItem(OFFLINE_DATA_KEY, JSON.stringify(d)); }catch(e){} }
function getCachedData(){ try{ const s = localStorage.getItem(OFFLINE_DATA_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function cacheProfileLocally(p){ try{ localStorage.setItem(OFFLINE_PROFILE_KEY, JSON.stringify(p)); }catch(e){} }
function getCachedProfile(){ try{ const s = localStorage.getItem(OFFLINE_PROFILE_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function updateOfflineBanner(){
  const b = document.getElementById('offlineBanner');
  if(!b) return;
  if(IS_OFFLINE){
    b.style.display = 'flex';
    b.innerHTML = '<i class="ti ti-wifi-off"></i> Offline \u2014 showing last synced data. Changes need internet to save.';
  } else if(USING_CACHED_DATA){
    b.style.display = 'flex';
    b.innerHTML = '<i class="ti ti-refresh"></i> Showing cached data \u2014 reconnect to load the latest.';
  } else {
    b.style.display = 'none';
    b.innerHTML = '';
  }
}
window.addEventListener('online', function(){ IS_OFFLINE=false; updateOfflineBanner(); if(AUTH_STATUS==='ready'||AUTH_STATUS==='offline') checkSession(); });
window.addEventListener('offline', function(){ IS_OFFLINE=true; updateOfflineBanner(); });

function seedFlats(){
  const out = [];
  for(let floor=1; floor<=11; floor++){
    for(const w of ['A','B','C']) out.push({ id: floor+w, name:'', phone:'', active:true });
  }
  return out;
}

let DATA = { purchases: [], readings: [], users: [], flats: [] };
let CURRENT_USER = null;
let TAB = 'dashboard';
let EXPANDED_PURCHASE = null;
let REPORT_METHOD = {};
let HISTORY_FLAT = null;
let ACTIVE_BATCH_ID = null;
let SHOW_BATCH_SWITCH = false;
let EDIT_PURCHASE_ID = null;
let EDIT_CYLINDERS = [];
let EDIT_READING_ID = null;
let SET_RATE_FOR = null;
let GRAPH_RANGE = '6'; // 6 | 12 | all

let AUTH_STATUS = 'checking'; // checking | nobackend | signedout | pending | ready
let AUTH_MODE = 'login'; // login | signup
let PROFILES = [];

const ROLE_LABEL = { admin:'Admin', purchase_manager:'Purchase manager', meter_reader:'Meter reader', resident:'Resident' };

function nextPurchaseId(){
  let max = 0;
  DATA.purchases.forEach(function(p){
    const m = /^P-(\d+)/.exec(p.id);
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return 'P-' + String(max+1).padStart(3,'0');
}
function cylinderTotals(p){
  const cyls = p.cylinders || [];
  return {
    kg: cyls.reduce(function(s,c){return s+c.kg;},0),
    cost: cyls.reduce(function(s,c){return s+c.cost;},0),
    qty: cyls.reduce(function(s,c){return s+(c.qty||1);},0)
  };
}
function addDaysISO(iso, n){ const d = new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function firstCylDate(p){ const d = (p.cylinders||[]).map(function(c){return c.date;}).filter(Boolean).sort(); return d.length ? d[0] : null; }
// Billing period for a batch:
//  start = manual override, else first cylinder purchase date
//  end   = manual override, else the day before the NEXT batch's first purchase,
//          else (latest batch) today if open / last reading date if closed
//  days are counted inclusively (Aug 4 -> Aug 31 = 28 days), so back-to-back cycles never overlap or leave gaps.
function billingPeriod(p, readings){
  const autoStart = firstCylDate(p);
  if(!autoStart && !p.periodStart) return null;
  const start = p.periodStart || autoStart;
  let end, ongoing = false;
  if(p.periodEnd){ end = p.periodEnd; }
  else {
    const nextStarts = DATA.purchases.filter(function(o){ return o !== p; }).map(firstCylDate).filter(function(d){ return d && d > start; }).sort();
    if(nextStarts.length){ end = addDaysISO(nextStarts[0], -1); }
    else if(p.status === 'open'){ end = new Date().toISOString().slice(0,10); ongoing = true; }
    else {
      const rd = (readings||[]).filter(function(r){return r.purchaseId===p.id;}).map(function(r){return r.dateLogged;}).filter(Boolean).sort();
      const cd = (p.cylinders||[]).map(function(c){return c.date;}).filter(Boolean).sort();
      end = rd.length ? rd[rd.length-1] : cd[cd.length-1];
    }
  }
  if(end < start) end = start;
  const days = Math.round((new Date(end+'T00:00:00Z') - new Date(start+'T00:00:00Z')) / 86400000) + 1;
  return { start: start, end: end, days: days, ongoing: ongoing, manual: !!(p.periodStart || p.periodEnd) };
}

function computeBilling(purchase, readings, method){
  const totals = cylinderTotals(purchase);
  const rows = readings.filter(r => r.purchaseId === purchase.id).map(r => Object.assign({}, r, { units: r.current - r.previous }));
  const totalUnits = rows.reduce((s,r)=>s+r.units, 0);
  const pricePerKg = totals.kg > 0 ? totals.cost / totals.kg : 0;
  const conversionRatio = totalUnits > 0 ? totals.kg / totalUnits : 0;
  const rate = method === 'manual' ? (purchase.manualRate || 0) : conversionRatio;
  rows.forEach(r=>{ r.bill = r.units * rate * pricePerKg; });
  const totalBill = rows.reduce((s,r)=>s+r.bill,0);
  return { rows: rows, totalUnits: totalUnits, pricePerKg: pricePerKg, conversionRatio: conversionRatio, rate: rate, totalBill: totalBill, totalKg: totals.kg, totalCost: totals.cost };
}
function fmtTk(n){ return (isFinite(n)?n:0).toLocaleString('en-BD', {maximumFractionDigits:2}); }
function fmtQty(n){ return (isFinite(n)?n:0).toLocaleString('en-BD', {maximumFractionDigits:2}); }
function flatById(id){ return DATA.flats.find(function(f){ return f.id===id; }); }
function flatSortKey(id){
  const m = /^(\d+)([A-Za-z]*)$/.exec(id||'');
  return m ? [parseInt(m[1],10), m[2]] : [999999, id||''];
}
function naturalFlatCompare(idA, idB){
  const ka = flatSortKey(idA), kb = flatSortKey(idB);
  if(ka[0]!==kb[0]) return ka[0]-kb[0];
  return ka[1].localeCompare(kb[1]);
}
function sortedFlats(){ return DATA.flats.slice().sort(function(a,b){ return naturalFlatCompare(a.id,b.id); }); }

// ---- Flat-dashboard / cycle / reconciliation helpers (additive, reuse computeBilling) ----
function batchSeq(id){ const m = /^P-(\d+)/.exec(id); return m ? parseInt(m[1],10) : 0; }
function shortDate(d){
  if(!d) return '';
  const parts = d.split('-');
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return parts[2]+' '+months[parseInt(parts[1],10)-1];
}
function cycleLabel(period, index, full){
  const n = String(index+1).padStart(2,'0');
  if(!period) return 'Cycle '+n;
  return 'Cycle '+n+' \u2014 '+(full? period.start+' to '+period.end : shortDate(period.start)+'\u2013'+shortDate(period.end));
}
function cycleShortRange(period){ return period ? shortDate(period.start)+'\u2013'+shortDate(period.end) : ''; }
function flatCycles(flatId){
  const cycles = [];
  DATA.purchases.forEach(function(p){
    const bActual = computeBilling(p, DATA.readings, 'actual');
    const row = bActual.rows.find(function(r){return r.flatId===flatId;});
    if(!row) return;
    const manualBilled = p.manualRate != null && p.manualRate !== '' && p.manualRate > 0;
    let manual = null;
    if(manualBilled){
      const bManual = computeBilling(p, DATA.readings, 'manual');
      const mrow = bManual.rows.find(function(r){return r.flatId===flatId;});
      if(mrow) manual = { kg: mrow.units * bManual.rate, rate: bManual.rate, pricePerKg: bManual.pricePerKg, bill: mrow.bill };
    }
    cycles.push({
      purchaseId: p.id, seq: batchSeq(p.id), period: billingPeriod(p, DATA.readings),
      previous: row.previous, current: row.current, units: row.units,
      kg: row.units * bActual.rate, rate: bActual.rate, pricePerKg: bActual.pricePerKg, bill: row.bill,
      manualBilled: manualBilled, manual: manual
    });
  });
  cycles.sort(function(a,b){ return a.seq - b.seq; });
  return cycles;
}
function avg(arr){ return arr.length ? arr.reduce(function(s,v){return s+v;},0)/arr.length : 0; }
function computeReconciliation(p, readings){
  const totals = cylinderTotals(p);
  const actual = computeBilling(p, readings, 'actual');
  const manualSet = p.manualRate != null && p.manualRate !== '' && p.manualRate > 0;
  const result = {
    purchasedKg: totals.kg, totalUnits: actual.totalUnits,
    actual: {
      conversionRatio: actual.conversionRatio,
      calculatedKg: actual.totalUnits * actual.conversionRatio,
      reconciliationPct: totals.kg>0 ? (actual.totalUnits*actual.conversionRatio/totals.kg*100) : 0
    },
    manual: null
  };
  if(manualSet){
    const impliedKg = actual.totalUnits * p.manualRate;
    const diffKg = totals.kg - impliedKg;
    result.manual = { rate: p.manualRate, impliedKg: impliedKg, diffKg: diffKg,
      recoveryPct: totals.kg>0 ? (impliedKg/totals.kg*100) : 0, varianceTk: diffKg * actual.pricePerKg };
  }
  return result;
}
function barChart(values, shortLabels, colorVar){
  const w = 320, h = 150, pad = 26;
  const max = Math.max.apply(null, values.concat([0.01]));
  const gap = (w - pad*2) / Math.max(values.length,1);
  const barW = Math.min(gap*0.6, 34);
  let bars = '';
  values.forEach(function(v,i){
    const bh = max>0 ? (v/max) * (h - pad*2 - 14) : 0;
    const x = pad + i*gap + (gap-barW)/2;
    const y = h - pad - bh;
    bars += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="3" fill="'+colorVar+'"></rect>';
    bars += '<text x="'+(x+barW/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="var(--ink-soft)">'+fmtQty(v)+'</text>';
    bars += '<text x="'+(x+barW/2).toFixed(1)+'" y="'+(h-8)+'" font-size="8.5" text-anchor="middle" fill="var(--ink-soft)">'+(shortLabels[i]||'')+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:150px;" preserveAspectRatio="xMidYMid meet">'+bars+'<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="var(--line)"></line></svg>';
}

function can(action){
  const role = CURRENT_USER ? CURRENT_USER.role : null;
  if(role === 'admin') return true;
  if(action === 'addPurchase') return role === 'purchase_manager';
  if(action === 'addReading') return role === 'meter_reader';
  return false;
}

function renderMain(){

  if(AUTH_STATUS === 'signedout'){ m.innerHTML = viewAuth(); bindAuthEvents(); return; }

function bindAuthEvents(){
  const t = document.getElementById('authToggle');
  if(t) t.onclick = function(){ AUTH_MODE = AUTH_MODE==='signup' ? 'login' : 'signup'; renderMain(); };
  const f = document.getElementById('authForm');
  if(f) f.onsubmit = async function(e){
    e.preventDefault();
    const fd = new FormData(f);
    const email = fd.get('email'), password = fd.get('password');
    const msg = document.getElementById('authMsg');
    msg.textContent = 'Please wait\u2026';
    try{
      if(AUTH_MODE==='signup'){
        const name = fd.get('name');
        const res = await sb.auth.signUp({ email:email, password:password, options:{ data:{ name:name } } });
        if(res.error){ msg.textContent = res.error.message; return; }
        if(res.data.user && !res.data.session){ msg.textContent = 'Check your email to confirm, then sign in.'; AUTH_MODE='login'; renderMain(); return; }
        if(res.data.user){ await sb.from('profiles').insert({ id:res.data.user.id, name:name, email:email }); }
        await checkSession();
      } else {
        const res = await sb.auth.signInWithPassword({ email:email, password:password });
        if(res.error){ msg.textContent = res.error.message; return; }
        await checkSession();
      }
    }catch(err){ msg.textContent = 'Something went wrong. Try again.'; }
  };
  const so = document.getElementById('signOutBtn');
  if(so) so.onclick = async function(){ await sb.auth.signOut(); AUTH_STATUS='signedout'; CURRENT_USER=null; renderAll(); };
}
async function checkSession(){
  let session = null;
  try{
    const { data } = await sb.auth.getSession();
    session = data && data.session;
  }catch(e){ console.error('getSession failed', e); }

  if(!session){
    const cachedProfile = getCachedProfile();
    if(cachedProfile && IS_OFFLINE){
      CURRENT_USER = cachedProfile; AUTH_STATUS='ready'; USING_CACHED_DATA = true;
      DATA = getCachedData() || { purchases: [], readings: [], flats: seedFlats(), settings:{ abnormalThresholdPct: 25 } };
      normalizeData();
      if(CURRENT_USER.role === 'resident' && CURRENT_USER.flat_id) HISTORY_FLAT = CURRENT_USER.flat_id;
      renderAll();
      return;
    }
    AUTH_STATUS='signedout'; renderAll(); return;
  }

  let profile = null; let profileFetchFailed = false;
  try{
    let profRes = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    profile = profRes.data;
    if(!profile){
      const name = (session.user.user_metadata && session.user.user_metadata.name) || session.user.email;
      const ins = await sb.from('profiles').insert({ id:session.user.id, name:name, email:session.user.email }).select().maybeSingle();
      profile = ins.data;
    }
  }catch(e){ console.error('profile fetch failed', e); profileFetchFailed = true; }

  if(profile) cacheProfileLocally({ id: profile.id, name: profile.name, email: profile.email, role: profile.role, flat_id: profile.flat_id||null });

  if(!profile || profile.role === 'pending'){
    if(profileFetchFailed){
      const cachedProfile = getCachedProfile();
      if(cachedProfile && cachedProfile.role !== 'pending'){ profile = cachedProfile; USING_CACHED_DATA = true; }
      else { AUTH_STATUS = 'offline'; renderAll(); return; }
    } else {
      AUTH_STATUS='pending'; renderAll(); return;
    }
  }

  CURRENT_USER = { id: profile.id, name: profile.name, email: profile.email, role: profile.role, flat_id: profile.flat_id || null };
  AUTH_STATUS = 'ready';

  const loaded = await loadStore('lpg-data', true, undefined);
  if(loaded === undefined){
    const cached = getCachedData();
    DATA = cached || { purchases: [], readings: [], flats: seedFlats(), settings:{ abnormalThresholdPct: 25 } };
    USING_CACHED_DATA = true;
  } else if(loaded === null){
    DATA = { purchases: [], readings: [], flats: seedFlats(), settings:{ abnormalThresholdPct: 25 } };
    await saveStore('lpg-data', true, DATA);
  } else {
    DATA = loaded;
    cacheDataLocally(DATA);
    USING_CACHED_DATA = false;
  }
  normalizeData();
  if(CURRENT_USER.role === 'resident' && CURRENT_USER.flat_id) HISTORY_FLAT = CURRENT_USER.flat_id;
  renderAll();
}
function normalizeData(){
  if(!DATA.flats || DATA.flats.length===0) DATA.flats = seedFlats();
  if(!DATA.settings) DATA.settings = { abnormalThresholdPct: 25 };
  if(DATA.settings.abnormalThresholdPct === undefined) DATA.settings.abnormalThresholdPct = 25;
  (DATA.purchases||[]).forEach(function(p){
    if(p.manualRate === undefined) p.manualRate = null;
    if(!p.cylinders){
      p.cylinders = [{ id: uid('CYL'), date: p.date || new Date().toISOString().slice(0,10), kg: p.totalKg||0, cost: p.totalCost||0, qty: 1, hasPhoto:false }];
      delete p.date; delete p.totalKg; delete p.totalCost;
    }
    p.cylinders.forEach(function(c){ if(c.qty === undefined || c.qty === null || c.qty === '') c.qty = 1; });
  });
}

function buildingOverview(){
  const sortedAll = DATA.purchases.slice().sort(function(a,b){ return batchSeq(a.id)-batchSeq(b.id); });
  if(sortedAll.length===0) return '';
  const current = sortedAll[sortedAll.length-1];
  const t = cylinderTotals(current);
  const b = computeBilling(current, DATA.readings, REPORT_METHOD[current.id]||'actual');
  const activeFlats = DATA.flats.filter(function(f){return f.active;});
  const flatsWithReadings = b.rows.length;
  const flatsPending = Math.max(0, activeFlats.length - flatsWithReadings);
  const consumedKg = b.rows.reduce(function(s,r){return s+r.units*b.rate;},0);
  const avgPerFlat = flatsWithReadings>0 ? consumedKg/flatsWithReadings : 0;

  let html = '<div class="card"><h2>Building overview</h2><p class="sub">Current cycle: '+current.id+(current.status==='open'?' (still open)':'')+'</p>';
  html += '<div class="stat-grid-3">'
    + '<div class="stat"><div class="v">'+fmtQty(t.kg)+' kg</div><div class="l">Purchased</div></div>'
    + '<div class="stat"><div class="v">'+fmtQty(consumedKg)+' kg</div><div class="l">Consumed</div></div>'
    + '<div class="stat"><div class="v">Tk '+fmtTk(b.totalBill)+'</div><div class="l">Total billed</div></div>'
    + '<div class="stat"><div class="v">'+flatsWithReadings+' / '+activeFlats.length+'</div><div class="l">Flats read</div></div>'
    + '<div class="stat"><div class="v">'+flatsPending+'</div><div class="l">Pending</div></div>'
    + '<div class="stat"><div class="v">'+fmtQty(avgPerFlat)+' kg</div><div class="l">Avg / flat</div></div>'
    + '</div>';

  const chartCycles = sortedAll.slice(-8);
  if(chartCycles.length>1){
    const values = chartCycles.map(function(p){ const bb = computeBilling(p, DATA.readings, 'actual'); return bb.rows.reduce(function(s,r){return s+r.units*bb.rate;},0); });
    const labels = chartCycles.map(function(p){ return 'C'+(sortedAll.indexOf(p)+1); });
    html += '<div class="hint" style="margin-top:12px;">Building-wide consumption by cycle (actual method):</div>';
    html += barChart(values, labels, 'var(--teal)');
    html += '<div class="chart-legend">'+chartCycles.map(function(p){ const period=billingPeriod(p,DATA.readings); return 'C'+(sortedAll.indexOf(p)+1)+' = '+p.id+(period?' ('+period.start+' to '+period.end+')':''); }).join(' \u00b7 ')+'</div>';
  }
  html += '</div>';
  return html;
}

        + '<label>Purchase batch</label><select id="erBatch">'+DATA.purchases.map(function(pp){return '<option value="'+pp.id+'" '+(pp.id===r.purchaseId?'selected':'')+'>'+pp.id+'</option>';}).join('')+'</select>'
        + '<div class="hint">Moving this reading to a different batch fixes a mis-logged entry.</div>'
        + '<div class="rowbtns" style="margin-top:12px;"><button class="btn small" data-save-reading="'+r.id+'">Save</button><button class="btn secondary small" data-cancel-edit-reading="1">Cancel</button><button class="btn danger small" data-delete-reading="'+r.id+'">Delete</button></div>'
        + '</div></td></tr>';
    }
  });
  html += '</tbody><tfoot><tr><td colspan="3">Total</td><td class="num">'+fmtQty(b.totalUnits)+'</td><td class="num">'+fmtTk(b.totalBill)+'</td><td></td></tr></tfoot></table></div>';

  const rec = computeReconciliation(p, DATA.readings);
  html += '<div class="hint" style="margin:16px 0 6px;">Purchase vs. consumption reconciliation:</div>';
  html += '<div class="subcard"><b style="font-size:13px;">Actual method</b>'
    + '<div class="hint" style="margin:4px 0 8px;">This ratio is derived FROM the purchased KG and metered units, so it will always land close to 100% \u2014 that\u2019s expected by construction, not proof there\u2019s no leakage.</div>'
    + '<div class="tablewrap"><table style="margin-top:0;"><tbody>'
    + '<tr><td>Purchased KG</td><td class="num">'+fmtQty(rec.purchasedKg)+'</td></tr>'
    + '<tr><td>Total metered units</td><td class="num">'+fmtQty(rec.totalUnits)+'</td></tr>'
    + '<tr><td>Actual KG conversion</td><td class="num">'+rec.actual.conversionRatio.toFixed(3)+' kg/unit</td></tr>'
    + '<tr><td>Calculated KG consumed</td><td class="num">'+fmtQty(rec.actual.calculatedKg)+'</td></tr>'
    + '<tr><td>Reconciliation</td><td class="num">'+rec.actual.reconciliationPct.toFixed(1)+'%</td></tr>'
    + '</tbody></table></div></div>';
  if(rec.manual){
    html += '<div class="subcard"><b style="font-size:13px;">Manual method</b>'
      + '<div class="hint" style="margin:4px 0 8px;">This compares purchased gas against what the fixed manual rate implies was consumed \u2014 the meaningful number for spotting leakage or unrecovered cost.</div>'
      + '<div class="tablewrap"><table style="margin-top:0;"><tbody>'
      + '<tr><td>Purchased KG</td><td class="num">'+fmtQty(rec.purchasedKg)+'</td></tr>'
      + '<tr><td>Manual conversion rate</td><td class="num">'+rec.manual.rate+' kg/unit</td></tr>'
      + '<tr><td>Implied KG consumed</td><td class="num">'+fmtQty(rec.manual.impliedKg)+'</td></tr>'
      + '<tr><td>Difference / unaccounted KG</td><td class="num">'+fmtQty(rec.manual.diffKg)+'</td></tr>'
      + '<tr><td>Recovery</td><td class="num">'+rec.manual.recoveryPct.toFixed(1)+'%</td></tr>'
      + '<tr><td>Variance</td><td class="num">Tk '+fmtTk(rec.manual.varianceTk)+'</td></tr>'
      + '</tbody></table></div></div>';
  } else {
    html += '<div class="method-note">Set a manual conversion rate on this batch (via the Manual toggle above) to see the leakage/recovery comparison here.</div>';
  }

  html += '<button class="btn secondary small" style="margin-top:12px;" data-print="'+p.id+'">Download PDF ('+ (method==='actual'?'Actual':'Manual') +')</button>';
  html += '</div>';
  return html;
}

function autofillPrevious(){
  const flatSelect = document.getElementById('flatSelect');
  if(!flatSelect) return;
  const flatId = flatSelect.value;
  const last = DATA.readings.filter(function(r){return r.flatId===flatId;}).sort(function(a,b){return b.dateLogged.localeCompare(a.dateLogged);})[0];
  document.getElementById('prevInput').value = last ? last.current : 0;
  updateUnitsPreview();
}
function updateUnitsPreview(){
  const box = document.getElementById('unitsPreview');
  const prevEl = document.getElementById('prevInput'), currEl = document.getElementById('currInput'), flatSel = document.getElementById('flatSelect');
  if(!box || !prevEl || !currEl) return;
  if(currEl.value === ''){ box.style.display = 'none'; return; }
  const units = Math.round((parseFloat(currEl.value) - parseFloat(prevEl.value||0)) * 100) / 100;
  const last = flatSel ? DATA.readings.filter(function(r){return r.flatId===flatSel.value;}).sort(function(a,b){return b.dateLogged.localeCompare(a.dateLogged);})[0] : null;
  const lastUnits = last ? Math.round((last.current - last.previous) * 100) / 100 : null;
  let note = '', color = 'var(--ink)';
  if(units < 0){ note = 'Current reading is lower than previous \u2014 please re-check the meter.'; color = 'var(--red)'; }
  else if(lastUnits && lastUnits > 0){
    const pct = Math.round((units - lastUnits) / lastUnits * 100);
    const limit = (DATA.settings && DATA.settings.abnormalThresholdPct) || 25;
    note = 'Last cycle: ' + fmtQty(lastUnits) + ' units (' + (pct >= 0 ? '+' : '') + pct + '%)';
    if(pct > limit) { note += ' \u2014 noticeably higher than usual, double-check before saving.'; color = 'var(--red)'; }
  }
  box.style.display = 'block';
  box.innerHTML = '<div style="font-size:12px;color:var(--ink-soft);">Units used this cycle</div>'
    + '<div style="font-size:22px;font-weight:600;color:'+color+';">' + fmtQty(units) + ' units</div>'
    + (note ? '<div class="hint" style="color:'+color+';">' + note + '</div>' : '');
}

function viewHistory(){
  const isResident = CURRENT_USER.role === 'resident';
  if(isResident && !CURRENT_USER.flat_id){
    return '<div class="card"><div class="empty">Your account isn\u2019t linked to a flat yet. Ask an admin to assign your flat in Admin \u2192 People & access.</div></div>';
  }
  if(isResident) HISTORY_FLAT = CURRENT_USER.flat_id;
  if(!HISTORY_FLAT) HISTORY_FLAT = DATA.flats[0] ? DATA.flats[0].id : null;
  if(!HISTORY_FLAT) return '<div class="card"><div class="empty">No flats set up yet.</div></div>';

  const cycles = flatCycles(HISTORY_FLAT);
  const f = flatById(HISTORY_FLAT);

  let html = '<div class="card"><h2>Flat Dashboard</h2><p class="sub">Consumption, bills, and the full calculation chain for one flat.</p>';
  if(!isResident){
    html += '<select id="historyFlat">'+sortedFlats().map(function(fl){return '<option value="'+fl.id+'" '+(HISTORY_FLAT===fl.id?'selected':'')+'>'+fl.id+(fl.name?' \u2014 '+fl.name:'')+(fl.active?'':' (inactive)')+'</option>';}).join('')+'</select>';
  }
  html += '</div>';

  if(cycles.length===0){
    html += '<div class="card"><div class="empty">No billing cycles with a reading for '+HISTORY_FLAT+' yet.</div></div>';
    return html + photoHistorySection(HISTORY_FLAT);
  }

  const latest = cycles[cycles.length-1];
  const prevCycle = cycles.length>1 ? cycles[cycles.length-2] : null;
  const latestBill = latest.manualBilled && latest.manual ? latest.manual.bill : latest.bill;

  html += '<div class="card"><h2>'+HISTORY_FLAT+(f&&f.name?' \u2014 '+f.name:'')+'</h2><p class="sub">'+cycleLabel(latest.period, cycles.length-1)+'</p>';
  html += '<div class="row2">'
    + '<div class="subcard" style="text-align:center;"><div class="bignum">'+fmtQty(latest.kg)+' kg</div><div class="bignum-l">This cycle consumed</div></div>'
    + '<div class="subcard" style="text-align:center;"><div class="bignum">Tk '+fmtTk(latestBill)+'</div><div class="bignum-l">This cycle bill'+(latest.manualBilled?' (manual)':'')+'</div></div>'
    + '</div>';
  if(latest.manualBilled && latest.manual){
    html += '<div class="hint" style="margin-top:8px;">This cycle was billed at the manual rate ('+latest.manual.rate.toFixed(2)+' kg/unit) \u2014 actual-method reference: Tk '+fmtTk(latest.bill)+'.</div>';
  }
  if(prevCycle){
    const pctChange = prevCycle.kg>0 ? ((latest.kg-prevCycle.kg)/prevCycle.kg*100) : 0;
    const dir = pctChange>0.05 ? 'increased' : (pctChange<-0.05 ? 'decreased' : 'stayed about the same as');
    html += '<div class="hint" style="margin-top:10px;">Consumption '+dir+(Math.abs(pctChange)>=0.05?' by '+Math.abs(pctChange).toFixed(1)+'%':'')+' compared with last cycle ('+fmtQty(prevCycle.kg)+' kg).</div>';
  }

  html += '<div class="hint" style="margin:14px 0 6px;">Calculation chain for this cycle:</div>';
  html += '<div class="subcard"><div class="tablewrap"><table style="margin-top:0;"><tbody>'
    + '<tr><td>Previous Reading</td><td class="num">'+fmtQty(latest.previous)+'</td></tr>'
    + '<tr><td>Current Reading</td><td class="num">'+fmtQty(latest.current)+'</td></tr>'
    + '<tr><td>Units Consumed</td><td class="num">'+fmtQty(latest.units)+'</td></tr>'
    + '<tr><td>KG Consumed</td><td class="num">'+fmtQty(latest.kg)+' kg</td></tr>'
    + '<tr><td>Rate</td><td class="num">Tk '+fmtTk(latest.pricePerKg)+'/kg</td></tr>'
    + '<tr><td>Total Bill'+(latest.manualBilled?' (manual)':'')+'</td><td class="num">Tk '+fmtTk(latestBill)+'</td></tr>'
    + (latest.manualBilled && latest.manual ? '<tr><td>Actual-method reference</td><td class="num">Tk '+fmtTk(latest.bill)+'</td></tr>' : '')
    + '</tbody></table></div></div>';

  const kgs = cycles.map(function(c){return c.kg;});
  const issuedBill = function(c){ return (c.manualBilled && c.manual) ? c.manual.bill : c.bill; };
  const bills = cycles.map(issuedBill);
  html += '<div class="hint" style="margin:14px 0 6px;">Consumption summary:</div>';
  html += '<div class="stat-grid-3">'
    + '<div class="stat"><div class="v">'+fmtQty(latest.kg)+'</div><div class="l">This cycle kg</div></div>'
    + '<div class="stat"><div class="v">'+(prevCycle?fmtQty(prevCycle.kg):'\u2014')+'</div><div class="l">Previous cycle kg</div></div>'
    + '<div class="stat"><div class="v">'+fmtQty(avg(kgs.slice(-3)))+'</div><div class="l">Avg last 3</div></div>'
    + '<div class="stat"><div class="v">'+fmtQty(avg(kgs.slice(-6)))+'</div><div class="l">Avg last 6</div></div>'
    + '<div class="stat"><div class="v">'+fmtQty(kgs.slice(-12).reduce(function(s,v){return s+v;},0))+'</div><div class="l">Total last 12</div></div>'
    + '<div class="stat"><div class="v">'+cycles.length+'</div><div class="l">Cycles on record</div></div>'
    + '</div>';
  html += '<div class="hint" style="margin:14px 0 6px;">Billing summary'+(cycles.some(function(c){return c.manualBilled;})?' (actually-issued amounts, mixing actual and manual by cycle)':'')+':</div>';
  html += '<div class="stat-grid-3">'
    + '<div class="stat"><div class="v">Tk '+fmtTk(issuedBill(latest))+'</div><div class="l">This cycle</div></div>'
    + '<div class="stat"><div class="v">'+(prevCycle?'Tk '+fmtTk(issuedBill(prevCycle)):'\u2014')+'</div><div class="l">Previous cycle</div></div>'
    + '<div class="stat"><div class="v">Tk '+fmtTk(avg(bills.slice(-3)))+'</div><div class="l">Avg last 3</div></div>'
    + '<div class="stat"><div class="v">Tk '+fmtTk(avg(bills.slice(-6)))+'</div><div class="l">Avg last 6</div></div>'
    + '<div class="stat"><div class="v">Tk '+fmtTk(bills.reduce(function(s,v){return s+v;},0))+'</div><div class="l">Total, all cycles</div></div>'
    + '<div class="stat"><div class="v">Tk '+fmtTk(avg(bills))+'</div><div class="l">Avg / cycle</div></div>'
    + '</div>';

  if(cycles.length>=3){
    const priorAvg = avg(kgs.slice(0,-1));
    const threshold = (DATA.settings && DATA.settings.abnormalThresholdPct!=null) ? DATA.settings.abnormalThresholdPct : 25;
    if(priorAvg>0){
      const changePct = (latest.kg-priorAvg)/priorAvg*100;
      if(changePct >= threshold){
        html += '<div class="warn-box">\u26a0\ufe0f Higher than usual \u2014 '+HISTORY_FLAT+' consumed '+fmtQty(latest.kg)+' kg this cycle. Average previous consumption: '+fmtQty(priorAvg)+' kg. Increase: '+changePct.toFixed(1)+'%.</div>';
      } else if(changePct <= -threshold){
        html += '<div class="warn-box">\u26a0\ufe0f Lower than usual \u2014 '+HISTORY_FLAT+' consumed '+fmtQty(latest.kg)+' kg this cycle, '+Math.abs(changePct).toFixed(1)+'% below its usual average of '+fmtQty(priorAvg)+' kg. Worth checking a reading wasn\u2019t missed.</div>';
      }
    }
  }
  html += '</div>';

  const rangeN = GRAPH_RANGE==='all' ? cycles.length : Math.min(parseInt(GRAPH_RANGE,10), cycles.length);
  const shown = cycles.slice(-rangeN);
  const shownLabels = shown.map(function(c){ return 'C'+(cycles.indexOf(c)+1); });
  const legend = shown.map(function(c){ return 'C'+(cycles.indexOf(c)+1)+' = '+cycleShortRange(c.period); }).join(' \u00b7 ');

  html += '<div class="card"><h2>Monthly LPG consumption</h2><p class="sub">'+HISTORY_FLAT+' \u2014 by billing cycle, not calendar month</p>'
    + '<div class="range-toggle">'
      + '<button data-range="6" class="'+(GRAPH_RANGE==='6'?'on':'')+'">6 cycles</button>'
      + '<button data-range="12" class="'+(GRAPH_RANGE==='12'?'on':'')+'">12 cycles</button>'
      + '<button data-range="all" class="'+(GRAPH_RANGE==='all'?'on':'')+'">All</button>'
    + '</div>'
    + barChart(shown.map(function(c){return c.kg;}), shownLabels, 'var(--flame)')
    + '<div class="chart-legend">'+legend+'</div></div>';

  html += '<div class="card"><h2>Monthly LPG bill</h2><p class="sub">Same cycles, actually-issued billed amount (Tk)</p>'
    + barChart(shown.map(issuedBill), shownLabels, 'var(--teal)')
    + '<div class="chart-legend">'+legend+'</div></div>';

  html += '<div class="card"><h2>Billing history</h2><p class="sub">Complete calculation chain for every cycle. \u201cActual Bill\u201d is the reconciliation figure; \u201cManual Bill\u201d shows what was actually issued for cycles billed at a fixed rate.</p>'
    + '<div class="tablewrap"><table><thead><tr><th>Cycle</th><th class="num">Prev</th><th class="num">Curr</th><th class="num">Units</th><th class="num">KG</th><th class="num">Rate/kg</th><th class="num">Actual Bill</th><th class="num">Manual Bill</th></tr></thead><tbody>'
    + cycles.slice().reverse().map(function(c){
        const idx = cycles.indexOf(c);
        const manualCell = (c.manualBilled && c.manual) ? 'Tk '+fmtTk(c.manual.bill) : '\u2014';
        return '<tr><td>'+cycleLabel(c.period, idx)+'</td><td class="num">'+fmtQty(c.previous)+'</td><td class="num">'+fmtQty(c.current)+'</td><td class="num">'+fmtQty(c.units)+'</td><td class="num">'+fmtQty(c.kg)+'</td><td class="num">Tk '+fmtTk(c.pricePerKg)+'</td><td class="num">Tk '+fmtTk(c.bill)+'</td><td class="num">'+manualCell+'</td></tr>';
      }).join('')
    + '</tbody></table></div></div>';

  return html + photoHistorySection(HISTORY_FLAT);
}

      + (u.id!==CURRENT_USER.id ? '<button class="btn danger small" data-remove-profile="'+u.id+'">Remove</button>' : '')
      + '</div>';
  });
  html += '</div>';

  html += '<div class="card"><h2>Abnormal consumption alerts</h2><p class="sub">A flat\u2019s consumption is flagged on its dashboard when it swings this much versus its own average (needs at least 3 cycles of history).</p>'
    + '<label>Flag when consumption changes by more than</label><input type="number" id="thresholdInput" value="'+((DATA.settings&&DATA.settings.abnormalThresholdPct!=null)?DATA.settings.abnormalThresholdPct:25)+'" min="5" max="200" step="1"> <span class="hint">%</span>'
    + '<button class="btn small" id="saveThreshold" style="margin-top:12px;">Save</button></div>';

  html += '<div class="card"><h2>Free up photo storage</h2><p class="sub">Deletes old proof photos only \u2014 every reading, cylinder record, and bill stays exactly as it is. Photos are already shrunk automatically when captured; use this if storage space still gets tight.</p>'
    + '<label>Delete photos older than</label><select id="cleanupCutoff"><option value="3">3 months</option><option value="6" selected>6 months</option><option value="12">12 months</option></select>'
    + '<button class="btn danger small" id="cleanupPhotos" style="margin-top:12px;">Delete old photos</button></div>';

  html += '<div class="card"><h2>Flats & residents</h2><p class="sub">Add missing flats (e.g. 8D), rename residents, set phone numbers, and mark a flat inactive when it is not using LPG. Inactive flats are hidden from the reading form but keep their history.</p>';
  sortedFlats().forEach(function(f){
    html += '<div class="flatrow '+(f.active?'':'inactive')+'">'
      + '<div class="fid">'+f.id+'</div>'
      + '<input type="text" class="flatName" data-flat="'+f.id+'" value="'+(f.name||'')+'" placeholder="Resident name">'
      + '<input type="text" class="flatPhone" data-flat="'+f.id+'" value="'+(f.phone||'')+'" placeholder="8801XXXXXXXXX">'
      + '<span class="pill '+(f.active?'active':'inactive')+'" data-toggle-active="'+f.id+'">'+(f.active?'Active':'Inactive')+'</span>'
      + '<button class="btn danger small" data-remove-flat="'+f.id+'">Del</button>'
      + '</div>';
  });
  html += '<button class="btn" id="saveFlats" style="margin-top:14px;">Save flats & residents</button></div>';

  html += '<div class="card"><h2>Add a flat</h2><form id="addFlatForm">'
    + '<div class="row3"><div><label>Flat ID</label><input type="text" name="flatId" placeholder="e.g. 8D" required></div>'
    + '<div><label>Resident name</label><input type="text" name="name"></div>'
    + '<div><label>Phone</label><input type="text" name="phone" placeholder="8801XXXXXXXXX"></div></div>'
    + '<button class="btn" type="submit">Add flat</button></form></div>';
  return html;
}

function compressImage(file){
  return new Promise(function(resolve){
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const maxW = 480;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.5));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function waLink(readingId, purchaseId, method){
  const p = DATA.purchases.find(function(x){return x.id===purchaseId;});
  const b = computeBilling(p, DATA.readings, method);
  const row = b.rows.find(function(r){return r.id===readingId;});
  const f = flatById(row.flatId);
  const phone = (f.phone||'').replace(/[^0-9]/g,'');
  if(!phone || !row) return null;
  const greeting = f.name ? ('Dear '+f.name+', (Flat '+f.id+')') : ('Dear Flat '+f.id+' User,');
  const rateLine = method==='manual'
    ? ('Manual Conversion Rate: '+b.rate.toFixed(2)+' kg/unit')
    : ('Conversion Ratio (Actual): '+b.rate.toFixed(2)+' kg/unit');
  const msg = greeting+'\nYour LPG bill for '+p.id+' is ready.\n'
    + 'Previous Reading: '+fmtQty(row.previous)+' | Current Reading: '+fmtQty(row.current)+'\n'
    + 'Units Used: '+fmtQty(row.units)+' | '+rateLine+' | Price Per KG: '+fmtTk(b.pricePerKg)+' TK.\n'
    + 'Bill Amount: '+fmtTk(row.bill)+' TK.\n'
    + 'Please pay at your earliest convenience.\nThank you!';
  return 'https://wa.me/'+phone+'?text='+encodeURIComponent(msg);
}

function printReport(purchaseId, method){
  const p = DATA.purchases.find(function(x){return x.id===purchaseId;});
  const b = computeBilling(p, DATA.readings, method);
  const period = billingPeriod(p, DATA.readings);
  const methodLabel = method==='manual' ? ('Manual conversion rate: '+b.rate.toFixed(2)+' kg per meter unit (set by admin)') : ('Actual conversion ratio: '+b.rate.toFixed(3)+' kg per meter unit (calculated automatically from this batch)');
  const rec = computeReconciliation(p, DATA.readings);

  const jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
  if(!jsPDFCtor){ toast('PDF library failed to load \u2014 check your connection and try again'); return; }
  const doc = new jsPDFCtor({ unit: 'pt', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const margin = 40;
  let y = 50;

  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(27,42,46);
  doc.text('LPG Ledger \u2014 '+p.id, margin, y);
  y += 20;

  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(85,85,85);
  const metaLine = (period ? period.start+' to '+period.end+' ('+period.days+' days) \u00b7 ' : '')+cylinderTotals(p).qty+' cylinder(s) \u00b7 '+fmtQty(b.totalKg)+' kg \u00b7 Tk '+fmtTk(b.totalCost)+' \u00b7 blended price/kg Tk '+fmtTk(b.pricePerKg);
  doc.text(metaLine, margin, y);
  y += 16;

  const methodLines = doc.splitTextToSize('Billing method: '+methodLabel, pageWidth-2*margin-16);
  doc.setFillColor(243,226,210);
  doc.roundedRect(margin, y-10, pageWidth-2*margin, methodLines.length*12+12, 4, 4, 'F');
  doc.setTextColor(122,61,15);
  doc.text(methodLines, margin+8, y+2);
  y += methodLines.length*12+22;

  const rows = b.rows.slice().sort(function(a,c){return naturalFlatCompare(a.flatId,c.flatId);}).map(function(r){
    return [r.flatId, fmtQty(r.previous), fmtQty(r.current), fmtQty(r.units), fmtTk(r.bill)];
  });

  doc.autoTable({
    startY: y,
    margin: { left: margin, right: margin },
    head: [['Flat','Prev','Curr','Units','Bill (Tk)']],
    body: rows,
    foot: [['Total','','', fmtQty(b.totalUnits), fmtTk(b.totalBill)]],
    styles: { font:'helvetica', fontSize: 9, textColor:[27,42,46], halign:'right' },
    headStyles: { fillColor:[27,42,46], textColor:255, halign:'right' },
    footStyles: { fillColor:[231,234,231], textColor:[27,42,46], fontStyle:'bold', halign:'right' }
  });

  let ry = (doc.lastAutoTable ? doc.lastAutoTable.finalY : y+200) + 22;
  if(ry > doc.internal.pageSize.getHeight() - 90){ doc.addPage(); ry = 50; }
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(27,42,46);
  doc.text('Reconciliation', margin, ry); ry += 14;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(85,85,85);
  let recLine = 'Actual: '+rec.actual.reconciliationPct.toFixed(1)+'% (purchased vs. calculated-from-metered, expected near 100% by design)';
  if(rec.manual) recLine += ' \u00b7 Manual: '+rec.manual.recoveryPct.toFixed(1)+'% recovered, '+fmtQty(rec.manual.diffKg)+' kg / Tk '+fmtTk(rec.manual.varianceTk)+' unaccounted';
  const recLines = doc.splitTextToSize(recLine, pageWidth-2*margin);
  doc.text(recLines, margin, ry);

  addAddressFooter(doc);
  doc.save(cycleFilename(p.id));
}

async function boot(){
  if(!sb){ AUTH_STATUS = 'nobackend'; renderAll(); return; }
  sb.auth.onAuthStateChange(function(event){
    if(event === 'SIGNED_OUT'){ AUTH_STATUS='signedout'; CURRENT_USER=null; renderAll(); }
  });
  await checkSession();
}
boot();
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('service-worker.js').catch(function(){}); });
}
