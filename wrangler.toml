# Cloudflare Workers Static Assets configuration for LPG Ledger.
#
# Deliberately minimal, per instruction: no Worker script, no "main" entry,
# no server-side code. This is (and stays) a plain static HTML/CSS/JS PWA
# talking directly to Supabase from the browser -- Cloudflare here is
# only asked to serve the repo root as static files, exactly as-is.
#
# There is no build step (no npm run build, no dist/ folder) -- index.html,
# manifest.json, service-worker.js, css/, and js/ are served directly from
# the repository root.

name = "lpg-ledger-v5"
compatibility_date = "2026-08-18"

[assets]
directory = "."
